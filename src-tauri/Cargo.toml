[package]
name = "pebblex"
version = "0.1.0"
description = "PebbleX — one calm workspace, the X series"
authors = ["PebbleX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pebblex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.4"
arboard = "3"
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  "Win32_Storage",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_Security"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
