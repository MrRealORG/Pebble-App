[package]
name = "pebble"
version = "2.0.0"
description = "Pebble — everything in one smooth place. Tauri + Rust desktop shell."
authors = ["Built with Qwen"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pebble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
