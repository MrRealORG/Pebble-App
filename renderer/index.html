<style>
  /* Instant loading splash - zero external dependency, instant paint */
  #nx-splash {
    position: fixed; inset: 0; z-index: 999999;
    background: #141413; color: #f4f2ee;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
    user-select: none;
  }
  #nx-splash.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .nx-splash-box {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    animation: nx-splash-enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .nx-splash-mark {
    width: 68px; height: 68px; border-radius: 22px;
    background: linear-gradient(135deg, #1c261b 0%, #151d14 100%);
    border: 1px solid rgba(124, 213, 110, 0.25);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(124, 213, 110, 0.15);
    display: flex; align-items: center; justify-content: center;
    color: #7cd56e;
    animation: nx-splash-pulse 2s ease-in-out infinite alternate;
  }
  .nx-splash-mark svg { width: 36px; height: 36px; }
  .nx-splash-title {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #f4f2ee;
    display: flex; align-items: center; gap: 6px;
  }
  .nx-splash-badge {
    font-size: 11px; font-weight: 900; background: #7cd56e; color: #0f1c0d;
    padding: 2px 7px; border-radius: 99px; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .nx-splash-sub {
    font-size: 13px; color: #9b9a94; margin-top: -6px; font-weight: 500;
  }
  .nx-splash-loader {
    width: 140px; height: 3px; background: rgba(255, 255, 255, 0.08);
    border-radius: 99px; overflow: hidden; margin-top: 8px; position: relative;
  }
  .nx-splash-loader-bar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 40%;
    background: linear-gradient(90deg, transparent, #7cd56e, transparent);
    border-radius: 99px;
    animation: nx-splash-slide 1.2s ease-in-out infinite;
  }
  @keyframes nx-splash-enter {
    from { opacity: 0; transform: scale(0.92) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes nx-splash-pulse {
    from { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(124, 213, 110, 0.1); }
    to { box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(124, 213, 110, 0.35); }
  }
  @keyframes nx-splash-slide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  body.widget-mode #nx-splash { display: none !important; }
</style>
