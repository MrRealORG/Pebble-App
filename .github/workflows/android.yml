name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend bundles
        run: node scripts/build.js

      - name: Initialize Android Target (if needed)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi

      - name: Build Android APK (Release)
        run: |
          npx tauri android build --apk --target aarch64-linux-android || npx tauri android build --apk

      - name: Locate & Prepare Android APK
        run: |
          mkdir -p build-output/android
          find src-tauri/gen/android -name "*.apk" -exec cp {} build-output/android/PebbleX-Android-aarch64.apk \; 2>/dev/null || true
          find target -name "*.apk" -exec cp {} build-output/android/ 2>/dev/null || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PebbleX-Android-APK
          path: build-output/android/*.apk
          if-no-files-found: warn
