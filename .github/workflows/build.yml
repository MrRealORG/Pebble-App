name: Build Windows (Installer + Portable)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App (Installer + Binaries)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PebbleX v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: --verbose

      - name: Locate & Prepare Standalone Portable Executable
        shell: bash
        run: |
          mkdir -p build-output/portable
          mkdir -p build-output/installer
          
          # Copy release binary as standalone portable exe
          if [ -f src-tauri/target/release/pebblex.exe ]; then
            cp src-tauri/target/release/pebblex.exe build-output/portable/PebbleX-Portable-x64.exe
          fi
          
          # Copy NSIS installer
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} build-output/installer/PebbleX-Setup-x64.exe \; 2>/dev/null || true

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PebbleX-Installer-x64
          path: build-output/installer/*.exe
          if-no-files-found: warn

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PebbleX-Portable-x64
          path: build-output/portable/*.exe
          if-no-files-found: warn
